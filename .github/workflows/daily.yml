name: Daily proverb
on:
  schedule:
    # GitHub sometimes starts scheduled runs late or drops one, so there are three chances each morning.
    # The first run that gets through prepares the post and hands it to Buffer for 08:00 in Amman;
    # the later ones see that today's post is done and stop.
    - cron: "17 2 * * *"       # 05:17 in Amman
    - cron: "23 3 * * *"       # 06:23 in Amman
    - cron: "41 4 * * *"       # 07:41 in Amman
  workflow_dispatch: {}        # "Run workflow" button: always posts, straight away if 08:00 has passed
permissions:
  contents: write
concurrency:
  group: daily-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
      TIMEZONE: Asia/Amman
      POST_TIME: "08:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Already posted today?
        id: check
        if: github.event_name == 'schedule'
        run: python -m cdaily check >> "$GITHUB_OUTPUT"
      - name: Install tools
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare today's post
        if: steps.check.outputs.skip != 'true'
        run: python -m cdaily prepare
      - name: Publish the media files
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "circassian-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output
          git commit -m "Media for $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Send to Buffer
        if: steps.check.outputs.skip != 'true'
        run: python -m cdaily publish
      - name: Save what was posted
        if: steps.check.outputs.skip != 'true'
        run: |
          git add data/state.json output
          git commit -m "Posted $(date -u +%F)" || echo "nothing to commit"
          git push
