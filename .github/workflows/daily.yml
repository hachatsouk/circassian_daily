name: Daily proverb
on:
  schedule:
    # GitHub's timer is unreliable, so each run keeps a WEEK of posts queued in Buffer
    # (each at 08:00 Amman on its own day). Missed runs then cost nothing: Buffer still posts.
    - cron: "17 2 * * *"       # 05:17 in Amman
    - cron: "23 3 * * *"       # 06:23 in Amman
    - cron: "41 4 * * *"       # 07:41 in Amman
  workflow_dispatch: {}        # "Run workflow" button: tops up the queue; today's post goes now if 08:00 has passed
permissions:
  contents: write
concurrency:
  group: daily-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
      TIMEZONE: Asia/Amman
      DAYS_AHEAD: "7"
      POST_TIME: "08:00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Already posted today?
        id: check
        if: github.event_name == 'schedule'
        run: python -m cdaily check --days "$DAYS_AHEAD" >> "$GITHUB_OUTPUT"
      - name: Install tools
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare today's post
        if: steps.check.outputs.skip != 'true'
        run: python -m cdaily prepare --days "$DAYS_AHEAD"
      - name: Publish the media files
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "circassian-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output
          git commit -m "Media for $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Send to Buffer
        if: steps.check.outputs.skip != 'true'
        run: python -m cdaily publish --days "$DAYS_AHEAD"
      - name: Save what was posted
        if: steps.check.outputs.skip != 'true'
        run: |
          git add data/state.json output
          git commit -m "Posted $(date -u +%F)" || echo "nothing to commit"
          git push
